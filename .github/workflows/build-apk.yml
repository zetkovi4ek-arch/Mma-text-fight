name: Build MMA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o MMA_Text_Battles_OnlineBuild.zip
          cd MMA_Text_Battles_OnlineBuild
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: MMA_Text_Battles_OnlineBuild
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MMA-Text-Battles-Pro
          path: MMA_Text_Battles_OnlineBuild/app/build/outputs/apk/debug/app-debug.apk
